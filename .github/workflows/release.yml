# Builds the Rust APK and publishes it as a GitHub release when you push a tag like v2.2.0.0 (four parts: app.big.small.fix, matching the VERSION file).
# The app's auto-updater checks the latest release of the repo it was built with.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   secret  KEYSTORE_BASE64  = base64 of debug.keystore (same key every time, or phones refuse the update)
# Optional, only if this code repo stays private and releases go to a separate PUBLIC repo:
#   variable RELEASES_REPO   = owner/name of the public releases repo
#   secret   RELEASES_TOKEN  = personal access token with "contents: write" on that repo
name: Release Rust APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      UPDATE_REPO: ${{ vars.RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Check tag matches VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(tr -d "[:space:]" < VERSION)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != VERSION v$V"; exit 1; }

      - name: Run tests
        run: cargo test --release --lib

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          test -s release.keystore

      - name: Build APK
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # Pin the compile SDK to Android 15 (API 35) instead of whatever preview the runner has.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" >/dev/null
          KEYSTORE=release.keystore KEYSTORE_PASSWORD="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" bash build_apk.sh

      - name: Generate APK checksum
        run: sha256sum build/calculator-rust.apk > build/calculator-rust.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          token: ${{ vars.RELEASES_REPO && secrets.RELEASES_TOKEN || github.token }}
          tag_name: ${{ github.ref_name }}
          files: |
            build/calculator-rust.apk
            build/calculator-rust.apk.sha256
